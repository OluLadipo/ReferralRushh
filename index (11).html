<style>
/* Layout: one-screen arcade console. HUD strip on top, caller on the left, specialist cards on the right. Single bright look by choice. */
:root{
  color-scheme:light;
  --sky:#EEF4FF; --sky-deep:#D4E2FA; --card:#FFFFFF; --ink:#0B2A6B; --soft:#4A6191; --line:#C6D6F2;
  --tang:#1E63E0; --tang-deep:#1347A8; --good:#159456; --bad:#DD3B32; --warn:#C98500; --grape:#0B2A6B;
  --f-display:"Fredoka", "DM Sans", system-ui, sans-serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px, var(--sky-deep) 1.5px, transparent 0);background-size:22px 22px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}

.btn{font-family:var(--f-display);font-weight:600;font-size:17px;border:0;border-radius:14px;padding:11px 20px;background:var(--tang);color:#fff;box-shadow:0 4px 0 var(--tang-deep);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tang-deep)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.alt:active{box-shadow:0 1px 0 var(--line)}
.btn.grape{background:var(--grape);box-shadow:0 4px 0 #051A47}
.btn.sm{font-size:14.5px;padding:8px 13px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.screen{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:24px;min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
.big{font-size:clamp(44px,8vw,78px);font-weight:700;letter-spacing:-.01em}
.big span{color:var(--tang)}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
p{margin:0}
.lead{font-size:17px;max-width:58ch;color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* title */
.title{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.title{grid-template-columns:1fr}}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rules li{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;font-size:15px}
.rules .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff}
.headset{aspect-ratio:1;max-width:320px;width:100%;margin:0 auto}

/* HUD */
#app{display:flex;flex-direction:column;gap:16px}
.hud{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr)) auto;gap:10px}
@media (max-width:720px){
  .hud{grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:6px}
  .hud .h{padding:6px 8px;border-width:2px;border-radius:10px}
  .hud .h .v{font-size:17px}
  .hud .h .k{font-size:9.5px;letter-spacing:.05em}
  .hud .h.round .v{font-size:14.5px}
  .hud .audio{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;padding:4px 8px}
  .hud .audio .toggles{margin-top:0}
}
.h{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.h .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.h .v{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.h.round{background:var(--ink);color:#fff}
.h.round .k{color:#B7CBF2}

.hearts{letter-spacing:2px}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}

/* game */
.game{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:18px;align-items:start}

.caller{display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:12px;align-items:center}

.ring{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--good)}
.ring i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.bubble{position:relative;background:var(--sky);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:15.5px}
.bubble:before{content:"";position:absolute;top:-10px;left:22px;border:8px solid transparent;border-bottom-color:var(--ink)}
.snap{border:2px solid var(--ink);border-radius:12px;overflow:hidden;font-size:13.5px}
.snap-h{background:var(--ink);color:#fff;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px}
.snap dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;padding:10px}
.snap dt{color:var(--soft)}
.snap dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:12.5px}
.need{font-family:var(--f-display);font-weight:600;font-size:20px}
.need span{background:var(--tang);color:#fff;border-radius:8px;padding:0 8px}
.tools{font-size:13px;color:var(--soft);border-top:2px dashed var(--line);padding-top:10px}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.pc{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0;transition:transform .15s}
.pc.crossed{opacity:.55}
.pc.crossed .pn{text-decoration:line-through}
.pc.win{border-color:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 30%,transparent)}
.pc.fail{border-color:var(--bad)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pn{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15}
.pcl{font-size:13px;color:var(--soft)}
.addr{font-family:var(--f-mono);font-size:12px;color:var(--soft);background:var(--sky);border-radius:8px;padding:6px 8px;line-height:1.45;overflow-wrap:anywhere}
.flag{display:flex;flex-direction:column;gap:4px;border-radius:12px;padding:8px 10px;font-size:13px}
.flag b{font-family:var(--f-display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.flag .sc{font-family:var(--f-mono);font-size:12px;font-weight:700}
.flag.high{background:color-mix(in srgb,var(--good) 13%,#fff);color:#0E6A3D}
.flag.check{background:color-mix(in srgb,var(--warn) 16%,#fff);color:#7A5000}
.flag.low{background:color-mix(in srgb,var(--bad) 13%,#fff);color:#A3241D}
.flag.none{background:var(--sky);color:var(--soft)}
.flag .dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.flag.high .dot{background:var(--good)}
.flag.check .dot{border:2px solid var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.flag.low .dot{border:2.5px solid var(--bad)}
.flag.none .dot{border:2px dashed var(--soft)}
.note{font-size:13px;background:#E6EFFF;border:2px solid #B3CBF5;border-radius:12px;padding:8px 10px}
.note.ok{background:#E2F6EA;border-color:#A6DDBC}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.acts .btn{width:100%}

.result{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:3px solid var(--ink);border-radius:18px;padding:14px 16px;background:var(--card)}
.result.ok{background:#E6EFFF}
.result.bad{background:#FFE3E0}
.result h3{font-size:22px}
.pop{animation:pop .3s}
@keyframes pop{from{transform:scale(.92);opacity:.4}}
.toast{font-family:var(--f-display);font-weight:600;font-size:16px;padding:8px 14px;border-radius:12px;border:2px solid var(--ink);background:#E6EFFF}
.toast.ok{background:#E2F6EA}

/* summary */
.versus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.versus{grid-template-columns:1fr}}
.side{border:3px solid var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.side.today{background:#FFFFFF}
.side.flags{background:#E6EFFF}
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.metric .lbl{font-size:14px;color:var(--soft)}
.metric .num{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.metric .bar{grid-column:1/-1;height:10px;border-radius:99px;background:rgba(16,32,74,.08);overflow:hidden}
.metric .bar span{display:block;height:100%;border-radius:99px}
.verdict{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.4vw,30px)}
.fixes{display:flex;flex-wrap:wrap;gap:8px}
.fx{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:13px;background:var(--card)}
.fx b{font-weight:700}
.fx em{font-style:normal;color:var(--soft)}
.stamp{display:inline-block;transform:rotate(-4deg);border:3px solid var(--grape);color:var(--grape);font-family:var(--f-display);font-weight:700;border-radius:10px;padding:2px 10px;font-size:15px}

footer{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-size:13px;color:var(--soft)}
footer a{color:var(--grape);font-weight:700}

/* incoming call */
.incoming{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:36px}
.phone{width:96px;height:96px;border-radius:50%;background:var(--tang);border:4px solid var(--ink);display:grid;place-items:center;box-shadow:0 0 0 0 color-mix(in srgb,var(--tang) 50%,transparent);animation:ringpulse 1.2s infinite}
.phone svg{width:46px;height:46px;animation:wiggle .6s infinite}
@keyframes ringpulse{70%{box-shadow:0 0 0 26px transparent}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.incoming .who-big{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,34px)}
.queue{font-family:var(--f-mono);font-size:12px;color:var(--soft)}

/* patience */
.patience{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.patience .pl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.pbar{height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--sky)}
.pbar span{display:block;height:100%;background:var(--tang);transition:width .2s linear, background .3s}
#pmood{font-family:var(--f-display);font-weight:600;min-width:86px;text-align:right}
.bubble.cranky{background:#FFE9E7;border-color:var(--bad)}

/* hud extras */
.h.btnish{cursor:pointer;text-align:left;font:inherit;color:inherit}
.h.btnish:hover{background:var(--sky)}
.streak{font-family:var(--f-mono);font-size:11px;color:var(--tang);font-weight:700}
.toggles{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tg{font-family:var(--f-mono);font-size:11.5px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;background:var(--card);white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--tang);color:#fff}

/* popups */
.popup{position:fixed;z-index:60;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--tang);text-shadow:2px 2px 0 #fff, -2px -2px 0 #fff;animation:rise 1.1s ease-out forwards}
.popup.minus{color:var(--bad)}
@keyframes rise{from{transform:translate(-50%,0) scale(.8);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}to{transform:translate(-50%,-80px) scale(1);opacity:0}}

/* rank + badges */
.rank{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.rank .title{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.4vw,38px);color:var(--tang)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.badges{grid-template-columns:1fr}}
/* collapsible member snapshot + compact phone layout */
details.snap summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.snap summary::-webkit-details-marker{display:none}
details.snap summary::after{content:"Show";font-family:var(--f-mono);text-transform:none;letter-spacing:0;opacity:.8}
details.snap[open] summary::after{content:"Hide"}
@media (max-width:860px){
  .caller{padding:16px;gap:10px}
  .caller .tools{display:none}
  .caller .need{font-size:17px}
  .cards{gap:10px}
  .pc{padding:12px;gap:8px}
  .pc .acts{flex-direction:row}
  .pc .acts .btn{flex:1;padding-inline:8px}
  .headset{max-width:180px}
}
.badge{border:3px solid var(--ink);border-radius:16px;padding:12px;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--card)}
.badge .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tang);color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;border:3px solid var(--ink)}
.badge b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block;line-height:1.15}
.badge span{font-size:12.5px;color:var(--soft)}
.badge.locked{opacity:.42;border-style:dashed}
.badge.locked .medal{background:var(--sky);color:var(--soft)}

/* hold music */
.holdpromo{border:3px dashed var(--tang);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--card)}
.hold{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.hold .lead{margin:0 auto}
.stage{position:relative;width:220px;height:220px;display:grid;place-items:center;max-width:100%}
.hring{position:absolute;width:150px;height:150px;border:5px solid var(--tang);border-radius:50%;opacity:.8;pointer-events:none}
.tapbtn{width:150px;height:150px;border-radius:50%;border:4px solid var(--ink);background:var(--ink);color:#fff;font-family:var(--f-display);font-weight:700;font-size:28px;box-shadow:0 6px 0 #051A47;position:relative;z-index:1;touch-action:manipulation}
.tapbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #051A47}
.tapbtn.flash{background:var(--tang)}
.judge{font-family:var(--f-display);font-weight:700;font-size:24px;min-height:32px}
.judge.perfect{color:var(--good)} .judge.good{color:var(--tang)} .judge.miss{color:var(--bad)}
.hline{font-family:var(--f-mono);font-size:13px;color:var(--soft);min-height:20px}
.calm{width:min(420px,100%);display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px}
.calm .pbar span{background:var(--good)}
.eq{display:flex;gap:4px;align-items:flex-end;height:28px}
.eq i{width:6px;background:var(--tang);border-radius:3px;height:8px;transition:height .12s}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;width:9px;height:14px;border-radius:2px;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function pickThree(spec, heavy){
  const pool=PROVIDERS.filter(p=>p.spec===spec);
  const ok=shuffle(pool.filter(p=>p.status==='ok')), trap=shuffle(pool.filter(p=>p.status!=='ok'));
  /* the demo is short, so two of three records are bad: the problem shows up fast */
  const chosen = heavy && trap.length>1 ? [ok[0], trap[0], trap[1]] : [ok[0], trap[0], shuffle([...ok.slice(1),...trap.slice(1)])[0]];
  return shuffle(chosen).map(p=>p.id);
}
function buildShift(s){

    const k=(used[spec]=(used[spec]||0)+1)-1;
    const [first, last, age, pcp, said]=MEMBERS[spec][(k+s.m)%2];
    const staff = i===s.staffCall ? STAFF[pcp] : null;

    return {spec, name:first, full:`${first} ${last}`, age, pcp, staff, mid, line, color:COLORS[i%COLORS.length], providers:pickThree(spec, s.heavy), verified:[], done:false, result:null};

}

let AC=null, muted=false;
function tone(freq, dur, type='sine', when=0, vol=.07){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx = {
  ring(){ for(let i=0;i<4;i++){ tone(i%2?740:880,.08,'sine',i*.09,.05); } },
  ding(){ [523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.075,.07)); },
  buzz(){ tone(150,.38,'sawtooth',0,.05); tone(110,.38,'sawtooth',.05,.04); },
  catch(){ tone(988,.1,'square',0,.035); tone(1319,.16,'square',.09,.035); },
  pick(){ tone(520,.06,'triangle',0,.05); },
  tick(){ tone(300,.05,'square',0,.025); }
};

/* ---------- ambient music: soft pad chords, a low root and sparse bell notes through a slow filter ---------- */
const music = {on:true, playing:false, step:0, timer:null, bellT:null, nodes:null};
const mtof = m => 440*Math.pow(2,(m-69)/12);
const CHORDS = [[48,52,55,59],[45,48,52,55,59],[41,45,48,52],[43,47,50,52]]; // Cmaj7, Am9, Fmaj7, G6
const BELLS = [72,74,76,79,81,84];
function ctx(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function musicStart(){
  if(!music.on || music.playing) return;
  try{
    const a=ctx(), t=a.currentTime;
    const master=a.createGain(); master.gain.setValueAtTime(0,t); master.gain.linearRampToValueAtTime(.06,t+4);
    const filter=a.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=950; filter.Q.value=.6;
    const lfo=a.createOscillator(), lfoGain=a.createGain(); lfo.frequency.value=.04; lfoGain.gain.value=350; lfo.connect(lfoGain).connect(filter.frequency); lfo.start();
    const delay=a.createDelay(1); delay.delayTime.value=.45; const fb=a.createGain(); fb.gain.value=.38; const wet=a.createGain(); wet.gain.value=.5;
    delay.connect(fb).connect(delay); delay.connect(wet).connect(master);
    filter.connect(master); master.connect(a.destination);
    music.nodes={master, filter, lfo, delay}; music.playing=true;
    chord(); music.timer=setInterval(chord, 8000); bell();
  }catch(e){}
}
function chord(){
  if(!music.playing) return;
  const a=AC, n=music.nodes, ch=CHORDS[music.step++ % CHORDS.length], t=a.currentTime, lvl=.11/ch.length;
  ch.forEach(m=>[-5,5].forEach(det=>{
    const o=a.createOscillator(), g=a.createGain();
    o.type='triangle'; o.frequency.value=mtof(m); o.detune.value=det;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(lvl,t+2.5); g.gain.setValueAtTime(lvl,t+7); g.gain.linearRampToValueAtTime(0,t+10.5);
    o.connect(g).connect(n.filter); o.start(t); o.stop(t+11);
  }));
  const b=a.createOscillator(), bg=a.createGain();
  b.type='sine'; b.frequency.value=mtof(ch[0]-12);
  bg.gain.setValueAtTime(0,t); bg.gain.linearRampToValueAtTime(.09,t+1.5); bg.gain.linearRampToValueAtTime(0,t+9);
  b.connect(bg).connect(n.filter); b.start(t); b.stop(t+9.5);
}
function bell(){
  if(!music.playing) return;
  const a=AC, n=music.nodes, t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.value=mtof(BELLS[Math.floor(Math.random()*BELLS.length)]);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.035,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+2.8);
  o.connect(g); g.connect(n.master); g.connect(n.delay); o.start(t); o.stop(t+3);
  music.bellT=setTimeout(bell, 2500+Math.random()*4500);
}
function musicStop(){
  if(!music.playing) return;
  music.playing=false; clearInterval(music.timer); clearTimeout(music.bellT);
  const n=music.nodes, t=AC.currentTime;
  n.master.gain.cancelScheduledValues(t); n.master.gain.setValueAtTime(n.master.gain.value,t); n.master.gain.linearRampToValueAtTime(0,t+1.5);
  setTimeout(()=>{ try{ n.lfo.stop(); n.master.disconnect(); }catch(e){} }, 1700);
}

function verify(id){

function send(id){
  const c=cur(), p=P(id); if(c.done) return;
  const v=c.verified.includes(id), rem=remaining(c);
  c.done=true; st().minutes+=BASE;
  if(p.status==='ok' || (p.status==='wrong' && v)){
    const bonus=25*G.streak, speed=c.timedOut?0:Math.ceil(rem)*4;
    const total=100+bonus+speed;
    st().score+=total; st().speed+=speed; st().firstTime++; G.streak++; st().maxStreak=Math.max(st().maxStreak,G.streak);
    const extras=[bonus?`streak +${bonus}`:'', speed?`speed +${speed}`:''].filter(Boolean).join(' · ');
    c.result={ok:true, id, title: G.streak>=3?`Referral accepted · ${G.streak} in a row!`:'Referral accepted first try',
      body:`${c.staff?pick(STAFF_THANKS):pick(THANKS)} ${c.full} gets to ${p.name} without a callback.${extras?` <b>${extras}</b>`:''}${c.timedOut?' No speed bonus: they waited too long.':''}`};
    say(c.result.title); render(['score','minutes']); confetti(id); sfx.ding(); popup(id,'+'+total);
  } else {
    st().minutes+=CALLBACK; st().redone++; G.streak=0;
    G.fixes.push({shift:G.shift, p, how:'Found after a member callback'});
    const why = p.status==='blocked' ? `${p.name} can't take this referral (${p.type.toLowerCase()}).` : `The ${p.type.toLowerCase()} on file was wrong.`;

    ? `<div class="flag ${lv}"><b><span><span class="dot"></span>${LEVEL[lv]}</span><span class="sc">${p.score}</span></b>${p.reason}</div>`
    : `<div class="flag none"><b><span><span class="dot"></span>No confidence data</span></b>Looks like every other record.</div>`;
  const note = v ? `<div class="note ${p.status==='ok'?'ok':''}"><b>Office:</b> ${p.note}</div>` : '';
  let acts='';
  if(!c.done){
    if(blocked) acts=`<button class="btn sm alt" disabled>Can't take this referral</button>`;
    else acts=`<button class="btn sm" data-a="send" data-id="${id}">${v&&p.status==='wrong'?'Send with fixed info':'Send referral'}</button>${v?'':`<button class="btn sm alt" data-a="verify" data-id="${id}">Call office · 4 min</button>`}`;
  }
  return `<article class="${cls}" data-card="${id}">
    <div><div class="pn">${p.name}</div><div class="pcl">${p.clinic}</div></div>
    <div class="addr">${p.addr}<br>${p.phone}</div>
    ${flag}${note}
    <div class="acts">${acts}</div>
  </article>`;
}

function vPlay(){
  const c=cur(), s=SHIFTS[G.shift];
  if(!c.answered){
    const who = c.staff ? c.staff.split(',')[0] + ' · ' + c.pcp + '\'s office' : c.full;
    return `${vHud()}
    <section class="screen incoming">
      <span class="kicker">${s.name} · call ${G.call+1} of ${CALLS_PER_SHIFT}</span>
      <div class="phone" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></div>
      <div class="who-big">Incoming: ${who}</div>
      <p style="color:var(--soft)">Caller patience starts ticking when you pick up. Faster first-try referrals earn a speed bonus.${G.shift===1&&G.holdBonus?` <b style="color:var(--tang)">+${G.holdBonus}s patience from the hold music.</b>`:''}</p>
      <button class="btn" data-a="answer" id="answerBtn">Answer call</button>
      <span class="queue">${CALLS_PER_SHIFT-G.call-1} more in the queue</span>
    </section>`;
  }
  const r=remaining(c);
  const toast = G.last && !c.done ? (G.last.kind==='catch'
      ? `<span class="toast pop">Nice catch! +50 · added to the fix list</span>`
      : `<span class="toast ok pop">Record confirmed. Safe to send.</span>`) : '';
  return `${vHud()}
  <section class="game">
    <div class="screen caller">
      <span class="kicker">${s.name}</span>
      <div class="who"><span class="avatar" style="background:${c.color}">${c.staff?c.staff[0]:c.name[0]}</span>
        <div><div style="font-family:var(--f-display);font-weight:600;font-size:20px">${c.staff?c.staff.split(',')[0]:c.full}</div><span class="ring"><i></i>${c.staff?'On the line · '+c.staff.split(', ')[1]:'On the line · member'}</span></div></div>
      <div class="bubble ${c.timedOut?'cranky':''}">${c.timedOut ? (c.staff ? '"Hello? I have four more of these to call in. Are you still there?"' : '"Hello? Are you still there, honey? I\'ve been on hold forever."') : c.line}</div>
      ${c.done?'':`<div class="patience"><span class="pl">Patience</span><div class="pbar"><span id="pfill" style="width:${r/patCap()*100}%"></span></div><span id="pmood">${mood(r)}</span></div>`}
      <details class="snap" ${(G.snapOpen ?? matchMedia('(min-width: 861px)').matches)?'open':''}>
        <summary class="snap-h">Member snapshot</summary>
        <dl>
          <dt>Member</dt><dd>${c.full}, ${c.age}</dd>
          <dt>Member ID</dt><dd class="mono">${c.mid}</dd>
          <dt>Plan</dt><dd>Medicare Advantage HMO</dd>
          <dt>PCP</dt><dd>${c.pcp}</dd>
          <dt>Referral</dt><dd>Required for specialist visit</dd>
        </dl>
      </details>
      <div class="need">Needs: <span>${c.spec}</span></div>
      <div class="tools">${s.sub}</div>
    </div>
    <div class="stack">
      <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">In-network ${c.spec.toLowerCase()} near ${c.name}</h2>${toast}</div>
      ${c.done?`<div class="result ${c.result.ok?'ok':'bad'} pop"><div class="stack" style="gap:4px"><h3>${c.result.title}</h3><p>${c.result.body}</p></div>
        <button class="btn ${c.result.ok?'':'grape'}" data-a="next" id="nextBtn">${G.call<CALLS_PER_SHIFT-1?'Next call →':'End round →'}</button></div>`:''}
      <div class="cards">${c.providers.map(id=>vCard(id,c)).join('')}</div>
    </div>
  </section>`;
}

function statLine(lbl, val, max, color, suffix=''){
  return `<div class="metric"><span class="lbl">${lbl}</span><span class="num">${val}${suffix}</span><span class="bar"><span style="width:${max?Math.min(100,val/max*100):0}%;background:${color}"></span></span></div>`;
}

function vBetween(){
  const a=G.stats[0];
  return `<section class="screen stack" style="gap:18px">
    <span class="kicker">Round 1 done · ${a.minutes} minutes used</span>
    <h2 class="big" style="font-size:clamp(32px,5.6vw,50px)">${a.redone?`${a.redone===CALLS_PER_SHIFT?'Both':'One'} of your referrals bounced.`:'No bounces. Lucky guesses?'}</h2>
    <p class="lead">${a.redone?`That's ${a.redone*CALLBACK} minutes and ${a.redone===1?'a member':'two members'} waiting longer for care. Nothing told you which records to trust. That's a normal day on the referral line.`:`Two out of three records were bad on every call. Without flags, you were guessing.`}</p>
    <div class="screen" style="box-shadow:none;border-width:2px;background:#E6EFFF;padding:16px">
      <b style="font-family:var(--f-display);font-size:18px">Round 2: the confidence layer is on.</b>
      <p style="margin-top:4px">AI compared the credentialing file, the health plan's network roster and the provider directory. Every record now says <b>Looks good</b>, <b>Verify first</b> or <b>Likely wrong</b>, and why.</p>
    </div>
    <div class="holdpromo">
      <div class="stack" style="gap:4px"><span class="kicker">Bonus round · 10 seconds</span><b style="font-family:var(--f-display);font-size:20px">The Hold Music</b><span style="color:var(--soft)">Your callers are on hold while the AI check runs. Tap to the beat to keep them calm and earn extra patience for round 2.</span></div>
      <div class="row"><button class="btn" data-a="hold">Play The Hold Music</button><button class="btn alt" data-a="start" data-s="1">Skip to round 2</button></div>
    </div>
  </section>`;
}

function vFinal(){
  const [a,b]=G.stats;
  const maxMin=Math.max(a.minutes,b.minutes,1), maxRe=Math.max(a.redone,b.redone,1);
  const saved=a.minutes-b.minutes, fewer=a.redone-b.redone;
  let verdict;
  if(b.redone===0 && (a.redone>0 || saved>0)) verdict=`Zero callbacks with flags on${saved>0?`, and ${saved} minutes back`:''}.`;
  else if(fewer>0) verdict=`${fewer} fewer callback${fewer>1?'s':''} with flags on.`;
  else if(b.redone>0) verdict=`Flags only help if you trust them. Try round 2 again and check the yellow and red ones.`;
  else verdict=`Same result, but this time you knew why.`;
  const caught=G.fixes.filter(f=>f.how.startsWith('Caught')).length;
  return `<section class="screen stack" style="gap:20px">
    <span class="kicker">Demo complete</span>
    <h2 class="verdict">${verdict}</h2>
    <div class="versus">
      <div class="side today"><h3>Round 1 · Today</h3>
        ${statLine('Minutes on calls', a.minutes, maxMin, 'var(--bad)')}
        ${statLine('Member callbacks', a.redone, maxRe, 'var(--bad)')}
      </div>
      <div class="side flags"><h3>Round 2 · With confidence flags</h3>
        ${statLine('Minutes on calls', b.minutes, maxMin, 'var(--good)')}
        ${statLine('Member callbacks', b.redone, maxRe, 'var(--good)')}
      </div>
    </div>
    <p style="color:var(--soft)">${G.fixes.length?`You hit ${G.fixes.length} bad record${G.fixes.length>1?'s':''}${caught?` and caught ${caught} before it reached a member`:''}. In the full concept, each one lands on a ranked fix list for Provider Ops, so next week's data is cleaner for every rep and every AI tool that reads it.`:`In the full concept, every bad record a rep finds lands on a ranked fix list for Provider Ops, so next week's data is cleaner for every rep and every AI tool that reads it.`}</p>
    <div class="screen" style="box-shadow:none;border-width:2px;background:var(--sky);padding:18px;display:flex;flex-direction:column;gap:12px">
      <span class="kicker">That was four calls. Imagine a whole referral team.</span>
      <b style="font-family:var(--f-display);font-size:22px;line-height:1.2">Provider Data Confidence is a pilot-ready concept by Olu Ladipo.</b>
      <p>Reps lose 10 to 20 extra minutes on these calls today, and CMS requires Medicare Advantage directories to be accurate. The full concept covers the pilot plan, how the AI check works, and how success gets measured. I'd love to walk you through it.</p>
      <div class="row"><a class="btn" href="https://oluladportfolio.netlify.app" target="_blank" rel="noopener" style="text-decoration:none">See Olu's portfolio</a><a class="btn alt" href="https://www.linkedin.com/in/oluladipoinsights" target="_blank" rel="noopener" style="text-decoration:none">Connect on LinkedIn</a><button class="btn alt" data-a="restart">Play again</button></div>
    </div>
  </section>`;
}

/* ---------- The Hold Music: a 10-second tap-to-the-beat bonus between rounds ---------- */
const BPM=104, BEAT=60/BPM, COUNTIN=2, NBEATS=16;
const HOLD_MEL=[67,71,74,71,69,72,76,72,65,69,72,69,67,71,74,79];
const HOLD_LINES=['Your call is important to us.','Please continue to hold.','Did you know? 3 out of 3 records agree you\'re doing great.','Estimated wait time: soon-ish.','Now playing: Smooth Referral Jazz.'];
let H=null;
function holdTone(f,dur,type,when,vol){
  if(!music.on && muted) return;
  try{ const a=ctx(), t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); }catch(e){}
}
function vHold(){
  const done=H&&H.state==='done', playing=H&&H.state==='playing';
  return `<section class="screen hold">
    <span class="kicker">Bonus round · The Hold Music</span>
    <h2 style="font-size:clamp(26px,4.4vw,36px)">${done?(H.calm>=70?'Your callers are vibing.':H.calm>=40?'Your callers are... tolerating it.':'Your callers are not enjoying this.'):'Keep your callers calm on hold'}</h2>
    ${done?`<p class="lead">${H.perfect} perfect, ${H.good} good, ${H.miss} missed. Caller calm ended at ${H.calm}%.<br><b style="color:var(--tang)">Round 2 callers start with +${G.holdBonus}s of patience${H.pts?` and you bank +${H.pts} points`:''}.</b></p>
      <div class="row" style="justify-content:center"><button class="btn" data-a="start" data-s="1">Start round 2</button><button class="btn alt" data-a="hold">Play again</button></div>`
    :`<p class="lead">Tap the button (or press the space bar) when the ring hits it. Every beat you land keeps the callers calm.</p>
      <div class="stage"><div class="hring" id="hring"></div><button class="tapbtn" id="tapbtn" data-a="tap">${playing?'TAP':'START'}</button></div>
      <div class="judge" id="judge" aria-live="polite"></div>
      <div class="eq" aria-hidden="true">${'<i></i>'.repeat(9)}</div>
      <div class="hline" id="hline">${playing?HOLD_LINES[0]:'Press START, wait for two count-in clicks, then tap on the beat.'}</div>
      <div class="calm"><span class="pl" style="font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)">Caller calm</span><div class="pbar"><span id="hcalm" style="width:${H?H.calm:50}%"></span></div><span id="hcalmv" style="font-family:var(--f-mono);font-weight:700">${H?H.calm:50}%</span></div>
      ${playing?'':`<button class="btn alt sm" data-a="start" data-s="1">Skip to round 2</button>`}`}
  </section>`;
}
function holdOpen(){ holdStop(); H={state:'ready', calm:50}; G.screen='hold'; render(); scrollTop(); }
function holdStart(){
  const a=ctx();
  if(music.playing){ const g=music.nodes.master.gain; g.cancelScheduledValues(a.currentTime); g.setValueAtTime(g.value,a.currentTime); g.linearRampToValueAtTime(.008,a.currentTime+.4); }
  const lead=.15, t0=performance.now()+lead*1000;
  H={state:'playing', calm:50, perfect:0, good:0, miss:0, pts:0, t0, judged:new Set(), raf:0, lastLine:0};
  for(let i=0;i<COUNTIN;i++) holdTone(1200,.06,'square',lead+i*BEAT,.04);
  HOLD_MEL.forEach((m,i)=>{
    const w=lead+(COUNTIN+i)*BEAT;
    holdTone(mtof(m),BEAT*.9,'triangle',w,.07);
    holdTone(mtof(m+12),BEAT*.35,'sine',w,.025);
    if(i%2===0) holdTone(mtof(m-24),BEAT*1.6,'sine',w,.09);
    holdTone(mtof(m+4),BEAT*.4,'triangle',w+BEAT/2,.03);
  });
  render();
  const loop=()=>{ if(!H||H.state!=='playing') return; holdFrame(); H.raf=requestAnimationFrame(loop); };
  H.raf=requestAnimationFrame(loop);
}
const beatAt = i => H.t0 + (COUNTIN+i)*BEAT*1000;
function holdFrame(){
  const now=performance.now(), ring=document.getElementById('hring'), ms=BEAT*1000;
  const ph=(((now-H.t0)/ms)%1+1)%1;
  if(ring) ring.style.transform=`scale(${reduced?1:1.55-0.55*ph})`;
  document.querySelectorAll('.eq i').forEach((b,k)=>{ b.style.height=(6+Math.abs(Math.sin((now/ms)*Math.PI+k*.7))*22)+'px'; });
  for(let i=0;i<NBEATS;i++){ if(!H.judged.has(i) && now-beatAt(i)>200){ H.judged.add(i); H.miss++; holdCalm(-4); holdJudge('Miss','miss'); } }
  const line=Math.floor((now-H.t0)/2400); if(line!==H.lastLine && line>=0){ H.lastLine=line; const el=document.getElementById('hline'); if(el) el.textContent=HOLD_LINES[line%HOLD_LINES.length]; }
  if(now>beatAt(NBEATS-1)+450) holdEnd();
}
function holdTap(){
  if(!H||H.state!=='playing') return;
  const now=performance.now(); let best=-1, bd=1e9;
  for(let i=0;i<NBEATS;i++){ if(H.judged.has(i)) continue; const d=Math.abs(now-beatAt(i)); if(d<bd){bd=d;best=i;} }
  const btn=document.getElementById('tapbtn'); if(btn){ btn.classList.add('flash'); setTimeout(()=>btn.classList.remove('flash'),110); }
  if(best<0) return;
  if(bd<=90){ H.judged.add(best); H.perfect++; H.pts+=20; holdCalm(7); holdJudge('Perfect!','perfect'); }
  else if(bd<=190){ H.judged.add(best); H.good++; H.pts+=10; holdCalm(4); holdJudge('Good','good'); }
  else { holdCalm(-2); holdJudge('Off beat','miss'); }
}
function holdCalm(d){ H.calm=Math.max(0,Math.min(100,H.calm+d)); const b=document.getElementById('hcalm'), v=document.getElementById('hcalmv'); if(b) b.style.width=H.calm+'%'; if(v) v.textContent=H.calm+'%'; }
function holdJudge(t,c){ const j=document.getElementById('judge'); if(!j) return; j.className='judge '+c; j.textContent=t; }
function holdEnd(){
  cancelAnimationFrame(H.raf); H.state='done'; G.holdBonus=Math.round(H.calm/10); G.holdPts=H.pts;
  holdRestore(); if(H.calm>=70){ sfx.ding(); } render();
}
function holdRestore(){ if(music.playing && AC){ const g=music.nodes.master.gain; g.cancelScheduledValues(AC.currentTime); g.setValueAtTime(g.value,AC.currentTime); g.linearRampToValueAtTime(.06,AC.currentTime+1.5); } }
function holdStop(){ if(H&&H.state==='playing'){ cancelAnimationFrame(H.raf); H.state='done'; holdRestore(); } }
document.addEventListener('pointerdown', e=>{ if(H&&H.state==='playing'&&e.target.closest&&e.target.closest('#tapbtn')){ e.preventDefault(); holdTap(); } });
document.addEventListener('keydown', e=>{ if(G&&G.screen==='hold'&&H&&H.state==='playing'&&(e.code==='Space'||e.key===' ')){ e.preventDefault(); if(!e.repeat) holdTap(); } });

function render(bumps=[]){
  const app=document.getElementById('app');
  app.innerHTML = G.screen==='title'?vTitle() : G.screen==='play'?vPlay() : G.screen==='between'?vBetween() : G.screen==='hold'?vHold() : vFinal();
  if(!reduced) bumps.forEach(k=>{ const el=document.querySelector(`[data-hud="${k}"] .v`); if(el) el.classList.add('bump'); });
  const ab=document.getElementById('answerBtn'); if(ab) ab.focus({preventScroll:true});
  const nb=document.getElementById('nextBtn');
  if(nb && bumps.length){
    nb.focus({preventScroll:true});
    const res=document.querySelector('.result'), r=res.getBoundingClientRect();
    if(r.top<0 || r.bottom>innerHeight) res.scrollIntoView({block:'center', behavior:reduced?'auto':'smooth'});
  }
}

document.addEventListener('toggle', e=>{ if(e.target.matches && e.target.matches('details.snap')) G.snapOpen=e.target.open; }, true);
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a;
  if(a==='start') startShift(+b.dataset.s);
  else if(a==='verify') verify(b.dataset.id);
  else if(a==='send') send(b.dataset.id);
  else if(a==='next') next();
  else if(a==='answer') answer();
  else if(a==='hold') holdOpen();
  else if(a==='tap'){ if(!(H&&H.state==='playing')) holdStart(); }
  else if(a==='mute'){ muted=!muted; render(); }
  else if(a==='music'){ music.on=!music.on; if(music.on){ if(G.screen!=='title') musicStart(); } else musicStop(); render(); }
  else if(a==='restart'){ newGame(); scrollTop(); }
});

newGame();
</script>

</body></html>
